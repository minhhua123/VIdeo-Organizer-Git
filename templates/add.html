{% extends "layout.html" %}

{% block title %}
    Add Videos
{% endblock %}

{% block main %}
    <div class="container" style="max-width: 700px;">
        <h2 class="mb-4 fw-bold">Add A Video</h2>

        <form action="/add" method="POST" class="shadow-sm p-4 bg-body-tertiary rounded">

            <!-- Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" name="title" class="form-control">
            </div>

            <!-- Link -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Video Link<span class="text-danger">*</span></label>
                <input type="url" name="link" class="form-control" placeholder="https://..." required>
            </div>

            <!-- Content Type -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Content Type<span class="text-danger">*</span></label>

                {% if content_type_options %}
                    <select name="content_type" id="content_type_select" class="form-select mb-2">
                        <option value="">Select a content type</option>
                        {% for ct in content_type_options %}
                            <option value="{{ ct }}">{{ ct }}</option>
                        {% endfor %}
                        <option value="__other__">Other</option>
                    </select>

                    <input type="text" name="new_content_type" id="new_content_type_input"
                        class="form-control d-none"
                        placeholder="Enter a new content type">
                {% else %}
                    <input type="text" name="content_type" class="form-control"
                        placeholder="Skit, clothing ad, cinematic edit, etc." required>
                {% endif %}
            </div>



            <!-- Mood -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Mood</label>

                {% if mood_options %}
                    <select name="mood" id="mood_select" class="form-select mb-2">
                        <option value="">Select a mood</option>
                        {% for mood in mood_options %}
                            <option value="{{ mood }}">{{ mood }}</option>
                        {% endfor %}
                        <option value="__other__">Other</option>
                    </select>

                    <input type="text" name="new_mood" id="new_mood_input"
                        class="form-control d-none"
                        placeholder="Enter a new mood">
                {% else %}
                    <input type="text" name="mood" class="form-control"
                        placeholder="Funny, motivational, spooky, etc.">
                {% endif %}
            </div>



            <!-- Tag -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Tag</label>

                {% if tag_options %}
                    <select name="tag" id="tag_select" class="form-select mb-2">
                        <option value="">Select a tag</option>
                        {% for tag in tag_options %}
                            <option value="{{ tag }}">{{ tag }}</option>
                        {% endfor %}
                        <option value="__other__">Other</option>
                    </select>

                    <input type="text" name="new_tag" id="new_tag_input"
                        class="form-control d-none"
                        placeholder="Enter a new tag">
                {% else %}
                    <input type="text" name="tag" class="form-control"
                        placeholder="For giveaway event, for next drop, for pop up event, etc.">
                {% endif %}
            </div>

            <!-- Notes -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Notes</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Optional notes about the video"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-success w-100 py-2">
                Add Video
            </button>

        </form>
    </div>

    <script>
    function setupOtherToggle(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);

        if (!select) return;

        select.addEventListener("change", function() {
            if (select.value === "__other__") {
                input.classList.remove("d-none");
                input.required = true;
            } else {
                input.classList.add("d-none");
                input.required = false;
                input.value = "";
            }
        });
    }

    setupOtherToggle("content_type_select", "new_content_type_input");
    setupOtherToggle("mood_select", "new_mood_input");
    setupOtherToggle("tag_select", "new_tag_input");
    </script>


{% endblock %}
