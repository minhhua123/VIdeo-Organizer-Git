{% extends "layout.html" %}

{% block title %}
    Delete Video
{% endblock %}

{% block main %}
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 fw-bold">Delete Video</h2>

        <div class="shadow-sm p-4 bg-body-tertiary rounded">

            <p class="mb-4">Are you sure you want to delete the video titled "<strong>{{ video.title }}</strong>"?</p>

            <form action="/delete/{{ video.id }}" method="POST" class="d-inline">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
            <a href="/" class="btn btn-secondary ms-2">Cancel</a>

        </div>
    </div>

{% endblock %}
